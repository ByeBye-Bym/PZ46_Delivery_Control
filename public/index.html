<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Контроль доставок</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div class="shell">
      <header class="masthead">
        <h1>Контроль доставок</h1>
      </header>
      <main>
        <section class="panel controls">
          <h2>Сценарий ответа</h2>
          <label for="scenario">Выберите поведение сервера</label
          ><select id="scenario">
            <option value="ok">Успех: HTTP 200</option>
            <option value="http500">Ошибка: HTTP 503</option>
            <option value="invalid">Некорректный JSON</option>
            <option value="slow">Медленный сервер</option>
            <option value="empty">Пустой массив</option>
          </select>
          <div class="actions">
            <button id="load-button">Отправить запрос</button
            ><button id="cancel-button" class="danger" disabled>
              Отменить запрос
            </button>
          </div>
          <hr class="separator" />
        </section>
        <section class="panel content">
          <h2>Доставки</h2>
          <div id="status" class="status" role="status">
            Запрос ещё не отправлен.
          </div>
          <div id="summary" class="stats">Нет данных</div>
          <div id="parcel-list" class="list">
            <div class="empty">
              Сведения о доставках появятся после загрузки
            </div>
          </div>
        </section>
      </main>
      <footer class="page-foot"></footer>
    </div>
  </body>
</html>
